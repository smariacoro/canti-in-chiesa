name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se arrivano più push di fila, pubblica solo l'ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Controlla che il catalogo sia valido
        run: python -c "import json;d=json.load(open('app/data/songs.json',encoding='utf-8'));print(len(d['songs']),'canti')"

      - uses: actions/configure-pages@v5

      - name: Prepara i file da pubblicare
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deploy
        uses: actions/deploy-pages@v4
